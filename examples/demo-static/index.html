<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Gitwo Static Demo</title>
<style>
body{font-family:system-ui,sans-serif;background:#141821;color:#e6e6e6;display:flex;
min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:#1d2431;padding:32px 40px;border-radius:12px;max-width:480px;text-align:center}
h1{font-size:22px;margin:0 0 8px;color:#7ee2a8}
p{color:#9aa4b2;font-size:14px;line-height:1.7;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<h1>静态站点部署成功 ✔</h1>
<p>这个页面由 gitwo 从 git push 自动构建并发布，</p>
<p>通过 <code>/sites/&lt;仓库名&gt;/</code> 访问。</p>
</div>
</body>
</html>
